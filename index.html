<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2K Men's Wear — Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink: #1B2430;
    --paper: #FAF9F6;
    --canvas: #E7E2D6;
    --route: #C1440E;
    --steel: #7E8FA0;
    --confirm: #2F6B4F;
    --line: #D8D2C2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--canvas);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(27,36,48,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px;
  }

  .manifest {
    width: 100%;
    max-width: 560px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(27,36,48,0.04), 0 20px 40px -24px rgba(27,36,48,0.35);
    position: relative;
  }

  .manifest::before {
    content: "";
    position: absolute;
    top: -1px; left: 0; right: 0;
    height: 10px;
    background-image: radial-gradient(circle, var(--canvas) 4px, transparent 4.5px);
    background-size: 20px 20px;
    background-position: -6px -6px;
  }

  .manifest-head {
    padding: 32px 32px 20px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.01em;
    margin: 0;
    text-transform: uppercase;
  }

  .shop-address {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    line-height: 1.5;
    color: var(--steel);
    margin: 6px 0 0;
  }

  .manifest-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--steel);
    text-align: right;
  }

  form {
    padding: 28px 32px 8px;
    display: grid;
    gap: 18px;
  }

  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--steel);
    margin-bottom: 6px;
  }

  .field input,
  .field textarea {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 6px 2px 8px;
    transition: border-color 0.15s ease;
  }

  .field textarea { resize: vertical; min-height: 44px; font-size: 14px; }

  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-bottom-color: var(--route);
  }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  .date-combo {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    position: relative;
  }

  .date-combo input[type="text"] { flex: 1; }

  .date-combo button {
    background: none;
    border: none;
    border-bottom: 1.5px solid var(--line);
    font-size: 16px;
    line-height: 1;
    padding: 6px 4px 8px;
    cursor: pointer;
  }

  .date-combo input[type="date"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px;
    height: 1px;
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--line);
    margin: 4px 0;
  }

  .actions {
    padding: 22px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button#printSend {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--ink);
    border: none;
    padding: 15px 20px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  button#printSend:hover { background: var(--route); }
  button#printSend:active { transform: scale(0.98); }

  button#printSend:disabled {
    background: var(--steel);
    cursor: wait;
  }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    min-height: 16px;
    color: var(--steel);
  }

  .status.ok { color: var(--confirm); }
  .status.err { color: var(--route); }

  .stamp {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg) scale(0);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.08em;
    color: var(--confirm);
    border: 5px solid var(--confirm);
    padding: 10px 26px;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    z-index: 50;
  }

  .stamp.hit {
    animation: stampHit 0.9s cubic-bezier(.2,1.4,.4,1) forwards;
  }

  @keyframes stampHit {
    0%   { transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); opacity: 0; }
    35%  { transform: translate(-50%, -50%) rotate(-12deg) scale(0.95); opacity: 1; }
    50%  { transform: translate(-50%, -50%) rotate(-12deg) scale(1.05); opacity: 1; }
    70%  { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 0; transition: opacity 0.3s ease 1.4s; }
  }

  #printArea { display: none; }

  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      padding: 24px;
      font-family: 'IBM Plex Sans', sans-serif;
      color: #000;
    }
    #printArea h2 { font-family: 'Oswald', sans-serif; margin-bottom: 4px; }
    #printArea table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    #printArea td { padding: 8px 0; border-bottom: 1px solid #ccc; font-size: 14px; }
    #printArea td.label { color: #555; width: 40%; }
  }

  @media (max-width: 480px) {
    .row-2 { grid-template-columns: 1fr; }
    .manifest-head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .manifest-id { text-align: left; }
  }
</style>
</head>
<body>

<div class="manifest">
  <div class="manifest-head">
    <div>
      <p class="eyebrow">Billing Entry</p>
      <h1>2K Men's Wear</h1>
      <p class="shop-address">No.28 Walaja Complex,<br>N.S.B. Road,<br>Trichy - 620002.</p>
    </div>
    <div class="manifest-id" id="manifestId">NO. —</div>
  </div>

  <form id="billForm">
    <div class="field">
      <label for="clientName">Customer Name</label>
      <input type="text" id="clientName" required placeholder="e.g. SULAIMAN">
    </div>

    <div class="row-2">
      <div class="field">
        <label for="clientPhone">Customer Phone Number</label>
        <input type="tel" id="clientPhone" required placeholder="+91 6385589451">
      </div>
      <div class="field">
        <label for="invoiceNo">Invoice No.</label>
        <input type="text" id="invoiceNo" required placeholder="INV-1042">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" required placeholder="2450.00" step="0.01" min="0">
      </div>
      <div class="field">
        <label for="billDate">Bill Date</label>
        <div class="date-combo">
          <input type="text" id="billDate" required placeholder="DD-MM-YYYY">
          <button type="button" id="calendarBtn" aria-label="Pick date from calendar">📅</button>
          <input type="date" id="billDatePicker" tabindex="-1">
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="field">
      <label for="notes">Items / Notes</label>
      <textarea id="notes" placeholder="e.g. 2x Formal Shirt, 1x Trouser — Size 40"></textarea>
    </div>
  </form>

  <div class="actions">
    <button id="printSend" type="button">Print &amp; Send to WhatsApp</button>
    <p class="status" id="statusMsg"></p>
  </div>
</div>

<div id="printArea">
  <h2>2K Men's Wear — Invoice</h2>
  <table>
    <tr><td class="label">Customer Name</td><td id="pClientName"></td></tr>
    <tr><td class="label">Phone Number</td><td id="pClientPhone"></td></tr>
    <tr><td class="label">Invoice No.</td><td id="pInvoiceNo"></td></tr>
    <tr><td class="label">Amount</td><td id="pAmount"></td></tr>
    <tr><td class="label">Bill Date</td><td id="pBillDate"></td></tr>
    <tr><td class="label">Items / Notes</td><td id="pNotes"></td></tr>
  </table>
</div>

<div class="stamp" id="stamp">Sent</div>

<script>
  // ====== CONFIG ======
  // Replace with your deployed Google Apps Script Web App URL (Deploy > Web app > Execute as: Me, Who has access: Anyone)
  const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
  // ====================

  const form = document.getElementById('billForm');
  const btn = document.getElementById('printSend');
  const statusMsg = document.getElementById('statusMsg');
  const stamp = document.getElementById('stamp');
  const manifestId = document.getElementById('manifestId');

  const billDateText = document.getElementById('billDate');
  const billDatePicker = document.getElementById('billDatePicker');
  const calendarBtn = document.getElementById('calendarBtn');

  function formatDDMMYYYY(isoDate) {
    const [yyyy, mm, dd] = isoDate.split('-');
    return `${dd}-${mm}-${yyyy}`;
  }

  // Default to today, typed as DD-MM-YYYY
  const today = new Date();
  billDatePicker.valueAsDate = today;
  billDateText.value = formatDDMMYYYY(billDatePicker.value);

  calendarBtn.addEventListener('click', () => {
    if (billDatePicker.showPicker) billDatePicker.showPicker();
    else billDatePicker.focus();
  });

  billDatePicker.addEventListener('change', () => {
    if (billDatePicker.value) billDateText.value = formatDDMMYYYY(billDatePicker.value);
  });

  manifestId.textContent = 'NO. ' + Date.now().toString().slice(-6);

  function fillPrintArea(data) {
    document.getElementById('pClientName').textContent = data.clientName;
    document.getElementById('pClientPhone').textContent = data.clientPhone;
    document.getElementById('pInvoiceNo').textContent = data.invoiceNo;
    document.getElementById('pAmount').textContent = '₹' + Number(data.amount).toFixed(2);
    document.getElementById('pBillDate').textContent = data.billDate;
    document.getElementById('pNotes').textContent = data.notes || '—';
  }

  function fireStamp() {
    stamp.classList.remove('hit');
    void stamp.offsetWidth;
    stamp.classList.add('hit');
  }

  function downloadInvoicePDF(data) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a5' });

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 42;
    const left = margin;
    const right = pageWidth - margin;

    // ---- Watermark: faint, rotated company name behind everything else ----
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({ opacity: 0.06 }));
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(46);
    doc.setTextColor(27, 36, 48);
    doc.text("2K MEN'S WEAR", pageWidth / 2, pageHeight / 2, { align: 'center', angle: 32 });
    doc.restoreGraphicsState();

    // ---- Outer border for a cleaner, framed look ----
    doc.setDrawColor(210);
    doc.setLineWidth(0.75);
    doc.rect(margin - 14, margin - 14, pageWidth - 2 * (margin - 14), pageHeight - 2 * (margin - 14));

    let y = margin + 12;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(17);
    doc.setTextColor(0);
    doc.text("2K Men's Wear", left, y);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(110);
    y += 16;
    doc.text('No.28 Walaja Complex,', left, y);
    y += 12;
    doc.text('N.S.B. Road,', left, y);
    y += 12;
    doc.text('Trichy - 620002.', left, y);
    doc.setTextColor(0);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(12);
    y += 24;
    doc.text('INVOICE', left, y);

    y += 14;
    doc.setDrawColor(180);
    doc.setLineWidth(1);
    doc.line(left, y, right, y);
    y += 28;

    const rows = [
      ['Customer Name', data.clientName],
      ['Phone Number', data.clientPhone],
      ['Invoice No.', data.invoiceNo],
      // Rs. is used instead of the ₹ glyph, which the PDF's built-in font can't render
      ['Amount', 'Rs. ' + Number(data.amount).toFixed(2)],
      ['Bill Date', data.billDate],
      ['Items / Notes', data.notes || '—']
    ];

    rows.forEach(([label, value]) => {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      doc.text(label + ':', left, y);
      doc.setFont('helvetica', 'normal');
      doc.text(String(value), left + 140, y, { maxWidth: right - (left + 140) });
      y += 26;
    });

    // ---- Seal / stamp: company name + "PAID", bottom of the invoice ----
    const sealCx = right - 90;
    const sealCy = pageHeight - margin - 55;
    const sealR = 48;

    doc.setDrawColor(47, 107, 79); // stamp-ink green, matches the confirm color used on screen
    doc.setLineWidth(1.4);
    doc.circle(sealCx, sealCy, sealR, 'S');
    doc.circle(sealCx, sealCy, sealR - 5, 'S');

    doc.setTextColor(47, 107, 79);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text("2K MEN'S WEAR", sealCx, sealCy - 12, { align: 'center', angle: -6 });
    doc.setFontSize(15);
    doc.text('PAID', sealCx, sealCy + 8, { align: 'center', angle: -6 });
    doc.setFontSize(7);
    doc.setFont('helvetica', 'normal');
    doc.text(data.billDate, sealCx, sealCy + 22, { align: 'center', angle: -6 });
    doc.setTextColor(0);

    // Filename: exactly invoice number + bill date, no prompt shown to the user
    const fileName = `${data.invoiceNo}_${data.billDate}.pdf`;
    doc.save(fileName);
  }

  async function sendToWhatsApp(data) {
    const message =
      `*2K Men's Wear — New Bill*\n` +
      `Customer: ${data.clientName}\n` +
      `Phone: ${data.clientPhone}\n` +
      `Invoice: ${data.invoiceNo}\n` +
      `Amount: ₹${Number(data.amount).toFixed(2)}\n` +
      `Date: ${data.billDate}\n` +
      `Items: ${data.notes || '—'}`;

    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ message, clientPhone: data.clientPhone })
    });

    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res;
  }

  btn.addEventListener('click', async () => {
    if (!form.reportValidity()) return;

    const data = {
      clientName: document.getElementById('clientName').value.trim(),
      clientPhone: document.getElementById('clientPhone').value.trim(),
      invoiceNo: document.getElementById('invoiceNo').value.trim(),
      amount: document.getElementById('amount').value,
      billDate: document.getElementById('billDate').value,
      notes: document.getElementById('notes').value.trim()
    };

    btn.disabled = true;
    statusMsg.textContent = 'Sending...';
    statusMsg.className = 'status';

    try {
      downloadInvoicePDF(data);
      await sendToWhatsApp(data);
      statusMsg.textContent = 'Sent to WhatsApp ✓';
      statusMsg.className = 'status ok';
      fireStamp();
    } catch (err) {
      console.error(err);
      statusMsg.textContent = 'Could not send — check connection / Apps Script URL';
      statusMsg.className = 'status err';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
